global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: aerobooking
    environment: local
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
  - job_name: auth-service
    metrics_path: /metrics
    static_configs: [{targets: [auth-service:3001]}]
  - job_name: search-service
    metrics_path: /metrics
    static_configs: [{targets: [search-service:3002]}]
  - job_name: booking-service
    metrics_path: /metrics
    static_configs: [{targets: [booking-service:3003]}]
  - job_name: airline-connector
    metrics_path: /metrics
    static_configs: [{targets: [airline-connector:3004]}]
  - job_name: audit-service
    metrics_path: /metrics
    static_configs: [{targets: [audit-service:3005]}]
  - job_name: kong-gateway
    metrics_path: /metrics
    static_configs: [{targets: [kong:8001]}]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: valkey
    static_configs: [{targets: [valkey-exporter:9121]}]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{targets: [rabbitmq:15692]}]
  - job_name: node-exporter
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs: [{targets: [cadvisor:8080]}]
